      list.innerHTML = partnerMaster.map(p =>
        `<div class="popover-item" onclick="selectPartner('${p}')">${p}</div>`
      ).join('');

      const rect = input.getBoundingClientRect();
      popover.style.top = (rect.bottom + 4) + 'px';
      popover.style.left = rect.left + 'px';
      popover.classList.add('active');
    }

    function selectPartner(value) {
      document.getElementById('attr_partner').value = value;
      closeAllPopovers();
    }

    function openCalendar(targetId) {
      currentCalendarTarget = targetId;
      const input = document.getElementById(targetId);
      const popover = document.getElementById('calendarPopover');

      renderCalendar(new Date());

      const rect = input.getBoundingClientRect();
      popover.style.top = (rect.bottom + 4) + 'px';
      popover.style.left = rect.left + 'px';
      popover.classList.add('active');
    }

    function renderCalendar(date) {
      const calendar = document.getElementById('calendar');
      const year = date.getFullYear();
      const month = date.getMonth();
      const today = new Date();

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const days = ['日', '月', '火', '水', '木', '金', '土'];

      let html = `
        <div class="calendar-header">
          <button class="btn btn-secondary" onclick="changeMonth(-1)">◀</button>
          <span>${year}年${month + 1}月</span>
          <button class="btn btn-secondary" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid">
          ${days.map(d => `<div class="calendar-cell header">${d}</div>`).join('')}
      `;

      for (let i = 0; i < firstDay; i++) {
        html += '<div class="calendar-cell"></div>';
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = year === today.getFullYear() && month === today.getMonth() && d === today.getDate();
        html += `<div class="calendar-cell ${isToday ? 'today' : ''}" onclick="selectDate(${year}, ${month}, ${d})">${d}</div>`;
      }

      html += '</div>';
      calendar.innerHTML = html;
      calendar.dataset.year = year;
      calendar.dataset.month = month;
    }

    function changeMonth(delta) {
      const calendar = document.getElementById('calendar');
      const year = parseInt(calendar.dataset.year);
      const month = parseInt(calendar.dataset.month);
      renderCalendar(new Date(year, month + delta, 1));
    }

    function selectDate(year, month, day) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      document.getElementById(currentCalendarTarget).value = dateStr;
      closeAllPopovers();
    }

    function openNumpad(targetId) {
      currentNumpadTarget = targetId;
      const input = document.getElementById(targetId);
      const popover = document.getElementById('numpadPopover');

      const rect = input.getBoundingClientRect();
      popover.style.top = (rect.bottom + 4) + 'px';
      popover.style.left = rect.left + 'px';
      popover.classList.add('active');
    }

    function numpadInput(value) {
      const input = document.getElementById(currentNumpadTarget);
      let current = input.value.replace(/[¥,]/g, '');
      current += value;
      input.value = '¥' + parseInt(current || 0).toLocaleString();
    }

    function numpadClear() {
      document.getElementById(currentNumpadTarget).value = '';
    }

    function numpadBackspace() {
      const input = document.getElementById(currentNumpadTarget);
      let current = input.value.replace(/[¥,]/g, '');
      current = current.slice(0, -1);
      input.value = current ? '¥' + parseInt(current).toLocaleString() : '';
    }

    function closeNumpad() {
      closeAllPopovers();
    }

    // ==========================================
    // モーダル
    // ==========================================
    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // ==========================================
    // カスタム属性
    // ==========================================
    function openAddAttributeModal() {
      openModal('addAttributeModal');
    }

    function addCustomAttribute() {
      const name = document.getElementById('newAttrName').value;
      const type = document.getElementById('newAttrType').value;
      const required = document.getElementById('newAttrRequired').checked;

      if (!name) {
        showToast('属性名を入力してください', 'error');
        return;
      }

      const id = 'custom_' + Date.now();
      customAttributes.push({ id, name, type, required });

      renderCustomAttributes();
      closeModal('addAttributeModal');
      document.getElementById('newAttrName').value = '';
      document.getElementById('newAttrRequired').checked = false;

      showToast('属性を追加しました');
    }

    function renderCustomAttributes() {
      const container = document.getElementById('customAttributes');
      container.innerHTML = customAttributes.map(attr => `
        <div class="attr-row">
          <label class="attr-label ${attr.required ? 'required' : ''}">${attr.name}</label>
          <div class="attr-value">
            <input type="${attr.type === 'number' ? 'number' : 'text'}" class="form-input" id="${attr.id}">
            <button class="btn-icon" onclick="deleteCustomAttribute('${attr.id}')" style="color:var(--bengara);">×</button>
          </div>
        </div>
      `).join('');
    }

    function deleteCustomAttribute(id) {
      customAttributes = customAttributes.filter(a => a.id !== id);
      renderCustomAttributes();
      showToast('属性を削除しました');
    }

    function openAttributeSettings() {
      showToast('属性設定機能は開発中です', 'warning');
    }

    function openDetailSettings() {
      showToast('明細設定機能は開発中です', 'warning');
    }

    // ==========================================
    // OCR機能
    // ==========================================
    function startOcrMode() {
      // セルが選択されているか確認
      if (selectedCells.length === 0) {
        showToast('先に明細テーブルのセルを選択してください', 'warning');
        return;
      }

      isOcrMode = true;
      document.getElementById('ocrModeIndicator').classList.add('active');
      document.getElementById('ocrToolBtn').classList.add('active');
      document.getElementById('drawCanvas').style.cursor = 'crosshair';

      // 選択セル数を表示
      const rows = new Set(selectedCells.map(c => c.row)).size;
      showToast(`${selectedCells.length}個のセル (${rows}行) にOCR結果を入力します`);
    }

    function cancelOcrMode() {
      isOcrMode = false;
      isOcrSelecting = false;
      ocrSelectionStart = null;
      document.getElementById('ocrModeIndicator').classList.remove('active');
      document.getElementById('ocrToolBtn').classList.remove('active');
      document.getElementById('ocrSelection').style.display = 'none';
      document.getElementById('drawCanvas').style.cursor = currentTool === 'select' ? 'default' : 'crosshair';
    }

    function startOcrSelection(e) {
      const rect = e.target.getBoundingClientRect();
      ocrSelectionStart = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
      isOcrSelecting = true;

      const selection = document.getElementById('ocrSelection');
      selection.style.display = 'block';
      selection.style.left = ocrSelectionStart.x + 'px';
      selection.style.top = ocrSelectionStart.y + 'px';
      selection.style.width = '0px';
      selection.style.height = '0px';
    }

    function updateOcrSelection(e) {
      if (!isOcrSelecting || !ocrSelectionStart) return;

      const rect = e.target.getBoundingClientRect();
      const currentX = e.clientX - rect.left;
      const currentY = e.clientY - rect.top;

      const selection = document.getElementById('ocrSelection');
      const left = Math.min(ocrSelectionStart.x, currentX);
      const top = Math.min(ocrSelectionStart.y, currentY);
      const width = Math.abs(currentX - ocrSelectionStart.x);
      const height = Math.abs(currentY - ocrSelectionStart.y);

      selection.style.left = left + 'px';
      selection.style.top = top + 'px';
      selection.style.width = width + 'px';
      selection.style.height = height + 'px';
    }

    async function endOcrSelection(e) {
      if (!isOcrSelecting || !ocrSelectionStart) return;

      const rect = e.target.getBoundingClientRect();
      const endX = e.clientX - rect.left;
      const endY = e.clientY - rect.top;

      const left = Math.min(ocrSelectionStart.x, endX);
      const top = Math.min(ocrSelectionStart.y, endY);
      const width = Math.abs(endX - ocrSelectionStart.x);
      const height = Math.abs(endY - ocrSelectionStart.y);

      isOcrSelecting = false;

      // 選択領域が小さすぎる場合はキャンセル
      if (width < 10 || height < 10) {
        document.getElementById('ocrSelection').style.display = 'none';
        return;
      }

      // OCR実行
      await performOcr(left, top, width, height);

      // 選択領域を非表示
      document.getElementById('ocrSelection').style.display = 'none';
      cancelOcrMode();
    }

    async function performOcr(x, y, width, height) {
      const pdfCanvas = document.getElementById('pdfCanvas');

      // 選択領域を切り出すためのキャンバス
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width;
      tempCanvas.height = height;
      const tempCtx = tempCanvas.getContext('2d');

      // PDFキャンバスから選択領域をコピー
      tempCtx.drawImage(pdfCanvas, x, y, width, height, 0, 0, width, height);

      // プログレス表示
      const progress = document.getElementById('ocrProgress');
      const progressFill = document.getElementById('ocrProgressFill');
      const progressText = document.getElementById('ocrProgressText');
      progress.classList.add('active');
      progressFill.style.width = '0%';
      progressText.textContent = '初期化中...';

      try {
        // Tesseract.jsでOCR実行
        const result = await Tesseract.recognize(
          tempCanvas.toDataURL(),
          'jpn+eng',
          {
            logger: (m) => {
              if (m.status === 'recognizing text') {
                const percent = Math.round(m.progress * 100);
                progressFill.style.width = percent + '%';
                progressText.textContent = `認識中... ${percent}%`;
              } else {
                progressText.textContent = m.status;
              }
            }
          }
        );

        progress.classList.remove('active');

        // 結果を取得
        const text = result.data.text.trim();

        if (!text) {
          showToast('テキストを認識できませんでした', 'warning');
          return;
        }

        // 行ごとに分割
        const lines = text.split('\n').filter(line => line.trim());

        // 選択されているセルに行ごとに入力
        // 行ごとにグループ化
        const rowGroups = {};
        selectedCells.forEach(cell => {
          if (!rowGroups[cell.row]) {
            rowGroups[cell.row] = [];
          }
          rowGroups[cell.row].push(cell);
        });

        // 行をソート
        const sortedRows = Object.keys(rowGroups).map(Number).sort((a, b) => a - b);

        // 各行にOCR結果を入力
        sortedRows.forEach((rowIdx, lineIdx) => {
          if (lineIdx < lines.length) {
            const cells = rowGroups[rowIdx].sort((a, b) => a.col - b.col);
            const lineText = lines[lineIdx].trim();

            // 行内の複数セルに分割して入力（タブやスペースで区切り）
            const parts = lineText.split(/\t+|\s{2,}/).filter(p => p.trim());

            cells.forEach((cell, partIdx) => {
              if (partIdx < parts.length) {
                const col = detailColumns[cell.col];
                if (!col.formula) {
                  detailRows[cell.row][col.id] = parts[partIdx].trim();
                }
              } else if (parts.length === 1) {
                // 分割できない場合は最初のセルに全体を入力
                if (partIdx === 0) {
                  const col = detailColumns[cell.col];
                  if (!col.formula) {
                    detailRows[cell.row][col.id] = lineText;
                  }
                }
              }
            });
          }
        });

        renderDetailTable();
        highlightSelectedCells();
        showToast(`${lines.length}行のテキストを認識しました`);

      } catch (error) {
        progress.classList.remove('active');
        console.error('OCR error:', error);
        showToast('OCR処理でエラーが発生しました', 'error');
      }
    }
  </script>
